name: Bootstrap UdyogMitra first admin

on:
  workflow_dispatch:
    inputs:
      admin_name:
        description: Full name of the first administrator
        required: true
        type: string
      admin_mobile:
        description: 10-digit mobile number (digits only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap-first-admin:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure one-time setup key on staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRST_ADMIN_SETUP_KEY: ${{ secrets.FIRST_ADMIN_SETUP_KEY }}
        run: |
          test -n "$FIRST_ADMIN_SETUP_KEY" || (echo "Missing FIRST_ADMIN_SETUP_KEY secret" && exit 1)
          printf '%s' "$FIRST_ADMIN_SETUP_KEY" | npx --yes wrangler secret put FIRST_ADMIN_SETUP_KEY --name udyog-mitra-staging

      - name: Create first administrator
        env:
          ADMIN_NAME: ${{ inputs.admin_name }}
          ADMIN_MOBILE: ${{ inputs.admin_mobile }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          FIRST_ADMIN_SETUP_KEY: ${{ secrets.FIRST_ADMIN_SETUP_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const name = process.env.ADMIN_NAME?.trim() || '';
          const mobile = process.env.ADMIN_MOBILE?.trim() || '';
          const password = process.env.ADMIN_PASSWORD || '';
          const setupKey = process.env.FIRST_ADMIN_SETUP_KEY || '';
          if (!name || !/^\d{10}$/.test(mobile) || password.length < 16 || !setupKey) {
            console.error('Invalid inputs: name, 10-digit mobile, setup key and admin password (16+ chars) are required.');
            process.exit(1);
          }
          const response = await fetch('https://udyog-mitra-staging.samskruthisamvardhanatrust.workers.dev/api/setup/first-admin', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ setup_key: setupKey, full_name: name, mobile, password })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            console.error('First-admin bootstrap failed:', response.status, result.error || result.message || 'Unknown error');
            process.exit(1);
          }
          console.log('First administrator created successfully.');
          NODE

      - name: Remove one-time setup key from staging Worker
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler secret delete FIRST_ADMIN_SETUP_KEY --name udyog-mitra-staging
